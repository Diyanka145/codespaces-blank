<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Recipe Suggester</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <main>
    <h1>Recipe Suggester</h1>
    <p>Tell me what dish or ingredient you're going for, and I'll suggest a recipe.</p>
    <div class="controls">
      <input id="query" placeholder="e.g. spaghetti, pancakes, chicken" />
      <button id="ask">Suggest recipe</button>
    </div>
    <section id="result"></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
